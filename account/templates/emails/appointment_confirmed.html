<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Appointment Confirmation</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f8fb; font-family:Segoe UI, Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f8fb; padding:40px 0;">
    <tr>
      <td align="center">

        <!-- Email Card -->
        <table width="100%" cellpadding="0" cellspacing="0"
               style="max-width:600px; background:#ffffff; border-radius:16px;
                      box-shadow:0 10px 30px rgba(26,53,92,0.12);
                      padding:32px 40px;">

          <!-- Header -->
          <tr>
            <td style="padding-bottom:16px;">
              <h2 style="margin:0; color:rgb(131,29,156); font-size:24px; font-weight:700;">
                Appointment Confirmed
              </h2>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="color:#1f2937; font-size:16px; line-height:1.6;">

              <p style="margin:0 0 16px 0;">
                Dear <strong>{{ patient_name }}</strong>,
              </p>

              <p style="margin:0 0 16px 0;">
                Your appointment with <strong>Dr. {{ doctor_name }}</strong><br>
                on <strong>{{ appointment_date }}</strong> at
                <strong>{{ appointment_time }}</strong>
                has been <strong style="color:#16a34a;">confirmed</strong>.
              </p>

              <p style="margin:0;">
                Thank you for choosing our healthcare services.
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding-top:28px; font-size:13px; color:#6b7280;">
              Please arrive at least 10 minutes early for your appointment.
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
