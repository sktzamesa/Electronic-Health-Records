            <a href="{% url 'dashboard' %}" class="sidebar-link"><span>🏠</span> <span class="sidebar-text">Dashboard</span></a>

</head>
<body>
    {% include "navbarprofile.html" %}
    <section class="register-section">
        <div class="register-flex">
           {% block content_wrapper %}
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  {% endblock %}
            </div>
    </section>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const birthdayInput = document.getElementById('register-birthday');
    const ageInput = document.getElementById('register-age');

    // Prevent future birthdays
    const today = new Date().toISOString().split("T")[0];
    birthdayInput.max = today;

    birthdayInput.addEventListener('change', function () {
        const birthDate = new Date(birthdayInput.value);
        const now = new Date();

        if (!isNaN(birthDate)) {
            let age = now.getFullYear() - birthDate.getFullYear();
            const m = now.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && now.getDate() < birthDate.getDate())) {
                age--;
            }
            ageInput.value = age >= 0 ? age : '';
        }
    });
});

</script>
<script src="{% static 'js/script1.js' %}"></script>

</body>
</html>
